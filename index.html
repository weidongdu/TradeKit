<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #fff;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 24px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 4px;
  }
  .sub {
    color: #86868b;
    font-size: .92rem;
    margin-bottom: 40px;
  }
  .list { }
  .item {
    display: flex;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid #eee;
    text-decoration: none;
    color: inherit;
    gap: 16px;
  }
  .item:last-child { border-bottom: none; }
  .item .index {
    width: 24px;
    font-size: .85rem;
    color: #aeaeb2;
    font-weight: 500;
    flex-shrink: 0;
    text-align: right;
  }
  .item .body { flex: 1; min-width: 0; }
  .item .title {
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.4;
  }
  .item:hover .title { color: #0071e3; }
  .item .meta {
    font-size: .8rem;
    color: #aeaeb2;
    margin-top: 2px;
  }
  .spinner {
    text-align: center;
    padding: 48px 0;
    color: #aeaeb2;
    font-size: .88rem;
  }
  @media (max-width: 480px) {
    .container { padding: 48px 20px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Works</h1>
  <p class="sub" id="subtitle">Loading...</p>
  <div class="spinner" id="spinner">Loading…</div>
  <div class="list" id="list"></div>
</div>
<script>
function formatDate(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 3600000) return 'just now';
  if (diff < 86400000) return Math.round(diff / 3600000) + 'h ago';
  if (diff < 604800000) return Math.round(diff / 86400000) + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

fetch('/files.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(files => {
    const list = document.getElementById('list');
    const sub = document.getElementById('subtitle');
    document.getElementById('spinner').style.display = 'none';
    sub.textContent = files.length + ' work' + (files.length > 1 ? 's' : '');
    files.forEach((f, i) => {
      const a = document.createElement('a');
      a.className = 'item';
      a.href = '/' + f.name;
      a.innerHTML = '<span class="index">' + (i + 1) + '</span>'
        + '<div class="body"><div class="title">' + esc(f.title) + '</div>'
        + '<div class="meta">' + esc(f.name) + ' · ' + formatDate(f.modified) + '</div></div>';
      list.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('subtitle').textContent = 'Error';
    document.getElementById('list').innerHTML = '<div style="text-align:center;padding:48px 0;color:#86868b;font-size:.9rem;">Failed to load.<br><a href="price.html" style="color:#0071e3;text-decoration:underline;">Go to price →</a></div>';
  });
</script>
</body>
</html>
