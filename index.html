<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 960px; margin: 0 auto; padding: 80px 24px 96px; }
header { margin-bottom: 56px; }
header h1 {
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.15;
  margin-bottom: 8px;
}
header p {
  font-size: 17px;
  color: #86868b;
  line-height: 1.5;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.card {
  display: block;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0,0,0,.1);
}
.card-thumb {
  position: relative;
  height: 180px;
  overflow: hidden;
}
.card-thumb .bg {
  position: absolute;
  inset: 0;
  opacity: .85;
}
.card-thumb .decor {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.card-thumb .decor .c1,
.card-thumb .decor .c2,
.card-thumb .decor .c3 {
  position: absolute;
  border-radius: 50%;
  opacity: .18;
  background: #fff;
}
.card-thumb .decor .c1 { width: 120px; height: 120px; }
.card-thumb .decor .c2 { width: 80px; height: 80px; }
.card-thumb .decor .c3 { width: 60px; height: 60px; }
.card-thumb .icon {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-thumb .icon-box {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: rgba(255,255,255,.22);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,.25);
  font-size: 22px;
  font-weight: 600;
  color: #fff;
}
.card-body {
  padding: 20px 20px 22px;
}
.card-body h2 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  margin-bottom: 6px;
  letter-spacing: -.01em;
}
.card-body .desc {
  font-size: 13px;
  color: #86868b;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 14px;
}
.card-body .card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-body .card-date {
  font-size: 12px;
  color: #aeaeb2;
}
.card-body .card-cta {
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.card-cta svg {
  width: 14px; height: 14px;
  transition: transform .15s;
}
.card:hover .card-cta svg { transform: translateX(2px); }
.spinner {
  text-align: center;
  padding: 80px 0;
  color: #86868b;
}
@media (max-width: 640px) {
  .page { padding: 48px 16px 64px; }
  header { margin-bottom: 36px; }
  header h1 { font-size: 30px; }
  .card-thumb { height: 140px; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Works</h1>
    <p>Small tools &amp; experiments, built with care.</p>
  </header>
  <div class="spinner" id="spinner">Loading…</div>
  <div class="grid" id="grid"></div>
</div>
<script>
const THEMES = [
  { bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', accent: '#667eea' },
  { bg: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', accent: '#f5576c' },
  { bg: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', accent: '#4facfe' },
  { bg: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', accent: '#43e97b' },
  { bg: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', accent: '#fa709a' },
  { bg: 'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)', accent: '#a18cd1' },
  { bg: 'linear-gradient(135deg, #fccb90 0%, #d57eeb 100%)', accent: '#d57eeb' },
  { bg: 'linear-gradient(135deg, #0ba360 0%, #3cba92 100%)', accent: '#3cba92' },
];

function formatDate(ts) {
  return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

fetch('/files.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(files => {
    document.getElementById('spinner').style.display = 'none';
    const grid = document.getElementById('grid');
    files.forEach((f, i) => {
      const theme = THEMES[i % THEMES.length];
      const letter = (f.title[0] || f.name[0]).toUpperCase();
      const desc = f.desc || '';
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '/' + f.name;

      const c1x = Math.random() * 60 + 10;
      const c1y = Math.random() * 40 + 10;
      const c2x = Math.random() * 80 + 10;
      const c2y = Math.random() * 60 + 30;
      const c3x = Math.random() * 70 + 20;
      const c3y = Math.random() * 50 + 40;

      a.innerHTML = ''
        + '<div class="card-thumb">'
        + '<div class="bg" style="background:' + theme.bg + '"></div>'
        + '<div class="decor">'
        + '<div class="c1" style="left:' + c1x + '%;top:' + c1y + '%"></div>'
        + '<div class="c2" style="right:' + c2x + '%;bottom:' + c2y + '%"></div>'
        + '<div class="c3" style="left:' + c3x + '%;bottom:' + c3y + '%"></div>'
        + '</div>'
        + '<div class="icon"><div class="icon-box">' + letter + '</div></div>'
        + '</div>'
        + '<div class="card-body">'
        + '<h2>' + esc(f.title) + '</h2>'
        + (desc ? '<div class="desc">' + esc(desc) + '</div>' : '')
        + '<div class="card-foot">'
        + '<span class="card-date">' + formatDate(f.modified) + '</span>'
        + '<span class="card-cta" style="color:' + theme.accent + '">Open <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l4 4-4 4"/></svg></span>'
        + '</div>'
        + '</div>';
      grid.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('grid').innerHTML = '<div style="text-align:center;padding:64px 0;color:#86868b;">Failed to load.<br><a href="price.html" style="color:#667eea;">Go to price →</a></div>';
  });
</script>
</body>
</html>
