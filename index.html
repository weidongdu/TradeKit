<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #fff;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .hero {
    text-align: center;
    padding: 100px 24px 80px;
  }
  .hero h1 {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -.005em;
    line-height: 1.07143;
    margin-bottom: 12px;
  }
  .hero p {
    font-size: 21px;
    color: #86868b;
    font-weight: 400;
    line-height: 1.381;
    letter-spacing: .011em;
  }
  .grid {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .card {
    display: block;
    background: #fbfbfd;
    border-radius: 20px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: background .36s;
  }
  .card:hover { background: #f5f5f7; }
  .card-visual {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    opacity: .15;
    user-select: none;
  }
  .card-content {
    padding: 24px 28px 28px;
  }
  .card-content h2 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -.01em;
    line-height: 1.25;
    margin-bottom: 8px;
  }
  .card-content p {
    font-size: 14px;
    color: #86868b;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 16px;
    min-height: 42px;
  }
  .card-link {
    font-size: 14px;
    color: #06c;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .card:hover .card-link { text-decoration: underline; }
  .card-link svg {
    width: 12px; height: 12px;
    transition: transform .2s;
  }
  .card:hover .card-link svg { transform: translateX(2px); }
  .empty {
    text-align: center;
    padding: 80px 24px;
    color: #86868b;
    font-size: 17px;
  }
  .spinner {
    text-align: center;
    padding: 80px 0;
    color: #86868b;
    font-size: 17px;
  }
  @media (max-width: 680px) {
    .hero { padding: 72px 20px 56px; }
    .hero h1 { font-size: 40px; }
    .hero p { font-size: 17px; }
    .grid { grid-template-columns: 1fr; padding: 0 20px 60px; }
    .card-visual { height: 160px; }
    .card-content { padding: 20px 24px 24px; }
    .card-content h2 { font-size: 20px; }
  }
</style>
</head>
<body>
<section class="hero">
  <h1>Works.</h1>
  <p>Tools and experiments, crafted with care.</p>
</section>
<div class="spinner" id="spinner">Loading…</div>
<div class="grid" id="grid"></div>
<script>
function formatDate(ts) {
  return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

const SYMBOLS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

fetch('/files.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(files => {
    document.getElementById('spinner').style.display = 'none';
    const grid = document.getElementById('grid');
    files.forEach((f, i) => {
      const desc = f.desc || '';
      const letter = (f.title[0] || f.name[0]).toUpperCase();
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '/' + f.name;
      a.innerHTML = ''
        + '<div class="card-visual">' + letter + '</div>'
        + '<div class="card-content">'
        + '<h2>' + esc(f.title) + '</h2>'
        + (desc ? '<p>' + esc(desc) + '</p>' : '<p></p>')
        + '<span class="card-link">Learn more <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></span>'
        + '</div>';
      grid.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('grid').innerHTML = '<div class="empty">Unable to load.<br><a href="price.html" style="color:#06c;">View price →</a></div>';
  });
</script>
</body>
</html>
