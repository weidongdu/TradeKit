<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f6f8;
    color: #1a2332;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(165deg, #0b1120 0%, #1a2332 40%, #1e2d45 100%);
    padding: 72px 24px 96px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 700px 500px at 30% 0%, rgba(79,110,247,.18) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 80% 100%, rgba(236,72,153,.1) 0%, transparent 60%),
      radial-gradient(ellipse 300px 300px at 50% 50%, rgba(52,211,153,.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.5);
    font-size: .78rem;
    font-weight: 500;
    letter-spacing: .4px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .hero h1 {
    font-size: 2.6rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: -.8px;
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .hero h1 span {
    background: linear-gradient(135deg, #6c8cff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    color: rgba(255,255,255,.45);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 440px;
    margin: 0 auto;
  }

  /* ── Container ── */
  .container {
    max-width: 720px;
    margin: -56px auto 64px;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: #b0bcca;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border: 1.5px solid #e2e6ed;
    border-radius: 12px;
    font-size: .9rem;
    font-family: inherit;
    outline: none;
    background: #fff;
    color: #1a2332;
    transition: border-color .2s, box-shadow .2s;
    -webkit-appearance: none;
  }
  .search-wrap input:focus {
    border-color: #4f6ef7;
    box-shadow: 0 0 0 3px rgba(79,110,247,.1);
  }
  .search-wrap input::placeholder { color: #b0bcca; }

  .sort-btn {
    padding: 12px 16px;
    border: 1.5px solid #e2e6ed;
    border-radius: 12px;
    background: #fff;
    color: #5a6c7d;
    font-size: .85rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: border-color .2s, background .2s;
  }
  .sort-btn:hover { border-color: #b0bcca; }
  .sort-btn.active { border-color: #4f6ef7; color: #4f6ef7; background: #f5f7ff; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .grid-item {
    opacity: 0;
    transform: translateY(12px);
    animation: itemIn .4s ease-out forwards;
  }
  .grid-item:nth-child(1) { animation-delay: .04s; }
  .grid-item:nth-child(2) { animation-delay: .08s; }
  .grid-item:nth-child(3) { animation-delay: .12s; }
  .grid-item:nth-child(4) { animation-delay: .16s; }
  .grid-item:nth-child(5) { animation-delay: .2s; }
  .grid-item:nth-child(6) { animation-delay: .24s; }
  .grid-item:nth-child(7) { animation-delay: .28s; }
  .grid-item:nth-child(8) { animation-delay: .32s; }
  .grid-item:nth-child(9) { animation-delay: .36s; }
  .grid-item:nth-child(10) { animation-delay: .4s; }
  @keyframes itemIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    display: block;
    background: #fff;
    border-radius: 18px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    border: 1px solid transparent;
    transition: transform .2s, box-shadow .25s, border-color .2s;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.04);
    border-color: #e2e6ed;
  }
  .card:active { transform: translateY(-1px); }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 1.05rem;
    font-weight: 650;
    color: #1a2332;
    margin-bottom: 4px;
    line-height: 1.35;
  }
  .card-desc {
    font-size: .85rem;
    color: #7a8699;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0f2f5;
    font-size: .78rem;
    color: #b0bcca;
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }

  /* ── States ── */
  .spinner {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 64px 0;
  }
  .spinner span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #d0d6e0;
    animation: dot 1s ease-in-out infinite;
  }
  .spinner span:nth-child(2) { animation-delay: .12s; }
  .spinner span:nth-child(3) { animation-delay: .24s; }
  @keyframes dot {
    0%,80%,100% { transform: scale(.6); opacity: .3; }
    40% { transform: scale(1); opacity: .8; }
  }
  .empty-state {
    text-align: center;
    padding: 64px 20px;
    color: #9aa5b5;
  }
  .empty-state .big { font-size: 2.6rem; margin-bottom: 14px; }
  .empty-state p { font-size: .9rem; line-height: 1.6; }
  .hidden { display: none; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 32px 20px 48px;
    font-size: .8rem;
    color: #b0bcca;
  }
  .footer a { color: #7a8699; text-decoration: none; }
  .footer a:hover { color: #4f6ef7; }

  @media (max-width: 480px) {
    .hero { padding: 48px 20px 80px; }
    .hero h1 { font-size: 1.8rem; }
    .hero p { font-size: .9rem; }
    .container { margin-top: -44px; }
    .card { padding: 16px 18px; border-radius: 14px; }
    .card-icon { width: 40px; height: 40px; font-size: 1.1rem; }
    .card-title { font-size: .95rem; }
    .card-desc { font-size: .8rem; }
    .controls { flex-direction: column; }
    .sort-btn { justify-content: center; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="hero-badge">✦ Works</div>
    <h1>Creative <span>Portfolio</span></h1>
    <p id="heroSub">Loading...</p>
  </div>
</div>
<div class="container">
  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" placeholder="Search works…" autocomplete="off">
    </div>
    <button class="sort-btn active" id="sortName" data-sort="name">↑ Name</button>
    <button class="sort-btn" id="sortDate" data-sort="date">↓ Date</button>
  </div>
  <div class="spinner" id="spinner"><span></span><span></span><span></span></div>
  <div class="grid" id="grid"></div>
</div>
<div class="footer">Powered by <a href="/index.html">Portfolio</a></div>

<script>
const COLORS = [
  { bg: '#eef2ff', color: '#4f6ef7' },
  { bg: '#fdf2f8', color: '#e11d8f' },
  { bg: '#ecfdf5', color: '#16a34a' },
  { bg: '#fffbeb', color: '#d97706' },
  { bg: '#f5f3ff', color: '#7c3aed' },
  { bg: '#e0f2fe', color: '#0284c7' },
  { bg: '#fff1f2', color: '#e11d48' },
  { bg: '#f0fdf4', color: '#15803d' },
];
const ICONS = ['✦','◆','●','■','▲','★','♦','◉'];

let allFiles = [];
let sortBy = 'name';
let sortAsc = true;

function formatDate(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 3600000) return 'Just now';
  if (diff < 86400000) return Math.round(diff / 3600000) + 'h ago';
  if (diff < 604800000) return Math.round(diff / 86400000) + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getDesc(f) {
  return f.desc || f.title.replace(/[·•\-].*$/, '').trim() || f.name.replace('.html', '');
}

function render(filter) {
  const grid = document.getElementById('grid');
  const q = (filter || '').toLowerCase().trim();
  let matched = q ? allFiles.filter(f =>
    f.title.toLowerCase().includes(q) || f.name.toLowerCase().includes(q) || getDesc(f).toLowerCase().includes(q)
  ) : [...allFiles];

  matched.sort((a, b) => {
    let cmp = 0;
    if (sortBy === 'name') cmp = a.title.localeCompare(b.title);
    else cmp = a.modified - b.modified;
    return sortAsc ? cmp : -cmp;
  });

  if (matched.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="big">🔍</div><p>No works matching <strong>"' + esc(filter) + '"</strong></p></div>';
    return;
  }

  grid.innerHTML = '';
  matched.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'grid-item';
    const idx = i % COLORS.length;
    const c = COLORS[idx];
    const icon = ICONS[idx];
    const desc = getDesc(f);
    div.innerHTML = '<a class="card" href="/' + f.name + '">'
      + '<div class="card-top">'
      + '<span class="card-icon" style="background:' + c.bg + ';color:' + c.color + ';">' + icon + '</span>'
      + '<div class="card-body">'
      + '<div class="card-title">' + esc(f.title) + '</div>'
      + (desc ? '<div class="card-desc">' + esc(desc) + '</div>' : '')
      + '</div></div>'
      + '<div class="card-meta">'
      + '<span>📄 ' + esc(f.name) + '</span>'
      + '<span>·</span>'
      + '<span>⚡ ' + formatSize(f.size) + '</span>'
      + '<span>·</span>'
      + '<span>🕐 ' + formatDate(f.modified) + '</span>'
      + '</div></a>';
    grid.appendChild(div);
  });
}

// Search
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', function () { render(this.value); });

// Keyboard
document.addEventListener('keydown', function (e) {
  if (e.key === '/' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
  }
});

// Sort
function setupSort(btnId, key) {
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', function () {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    if (sortBy === key) { sortAsc = !sortAsc; }
    else { sortBy = key; sortAsc = key === 'name'; }
    this.textContent = (sortAsc ? '↑' : '↓') + ' ' + (key === 'name' ? 'Name' : 'Date');
    render(searchInput.value);
  });
}
setupSort('sortName', 'name');
setupSort('sortDate', 'date');

// Load
fetch('/files.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(files => {
    allFiles = files;
    document.getElementById('spinner').style.display = 'none';
    const h = document.getElementById('heroSub');
    h.textContent = files.length + ' work' + (files.length > 1 ? 's' : '') + ' — ' + new Date().getFullYear();
    render('');
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('heroSub').textContent = 'Error loading';
    document.getElementById('grid').innerHTML = '<div class="empty-state"><div class="big">⚠️</div><p>Failed to load works.<br><a href="price.html" style="color:#4f6ef7;text-decoration:underline;font-weight:500;">View latest work →</a></p></div>';
  });
</script>
</body>
</html>
