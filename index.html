<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #fff;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -.5px;
    margin-bottom: 4px;
  }
  .sub {
    color: #86868b;
    font-size: .92rem;
    margin-bottom: 32px;
  }
  input {
    width: 100%;
    padding: 10px 0;
    border: none;
    border-bottom: 1.5px solid #d2d2d7;
    font-size: .95rem;
    font-family: inherit;
    outline: none;
    background: transparent;
    color: #1d1d1f;
    transition: border-color .2s;
    -webkit-appearance: none;
    border-radius: 0;
  }
  input:focus { border-color: #0071e3; }
  input::placeholder { color: #aeaeb2; }
  .list { margin-top: 24px; }
  .item {
    display: flex;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #f0f0f0;
    text-decoration: none;
    color: inherit;
    gap: 14px;
    transition: opacity .15s;
  }
  .item:hover { opacity: .7; }
  .item:last-child { border-bottom: none; }
  .item .index {
    width: 24px;
    font-size: .8rem;
    color: #aeaeb2;
    font-weight: 500;
    flex-shrink: 0;
    text-align: right;
  }
  .item .body { flex: 1; min-width: 0; }
  .item .title {
    font-size: 1rem;
    font-weight: 500;
    color: #1d1d1f;
    line-height: 1.4;
  }
  .item .meta {
    font-size: .8rem;
    color: #aeaeb2;
    margin-top: 2px;
  }
  .empty {
    text-align: center;
    padding: 48px 0;
    color: #86868b;
    font-size: .9rem;
    line-height: 1.6;
  }
  .spinner {
    text-align: center;
    padding: 48px 0;
    color: #aeaeb2;
    font-size: .88rem;
  }
  @media (max-width: 480px) {
    .container { padding: 40px 20px 60px; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Works</h1>
  <p class="sub" id="subtitle">Loading...</p>
  <input type="search" id="search" placeholder="Search…" autocomplete="off">
  <div class="spinner" id="spinner">Loading…</div>
  <div class="list" id="list"></div>
</div>
<script>
let allFiles = [];

function formatDate(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 3600000) return 'just now';
  if (diff < 86400000) return Math.round(diff / 3600000) + 'h ago';
  if (diff < 604800000) return Math.round(diff / 86400000) + 'd ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render(filter) {
  const list = document.getElementById('list');
  const q = (filter || '').toLowerCase().trim();
  let matched = q ? allFiles.filter(f =>
    f.title.toLowerCase().includes(q) || f.name.toLowerCase().includes(q)
  ) : allFiles;

  if (matched.length === 0) {
    list.innerHTML = '<div class="empty">No results for "' + esc(filter) + '"</div>';
    return;
  }

  list.innerHTML = '';
  matched.forEach((f, i) => {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = '/' + f.name;
    a.innerHTML = '<span class="index">' + (i + 1) + '</span>'
      + '<div class="body"><div class="title">' + esc(f.title) + '</div>'
      + '<div class="meta">' + esc(f.name) + ' · ' + formatDate(f.modified) + '</div></div>';
    list.appendChild(a);
  });
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', function () { render(this.value); });

document.addEventListener('keydown', function (e) {
  if (e.key === '/' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchInput) {
    searchInput.blur();
  }
});

fetch('/files.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(files => {
    allFiles = files;
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('subtitle').textContent = files.length + ' work' + (files.length > 1 ? 's' : '');
    render('');
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('subtitle').textContent = 'Error loading';
    document.getElementById('list').innerHTML = '<div class="empty">Failed to load.<br><a href="price.html" style="color:#0071e3;text-decoration:underline;">Go to price →</a></div>';
  });
</script>
</body>
</html>
