<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #fafafa;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 96px 24px 80px;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -.6px;
    margin-bottom: 8px;
  }
  .intro {
    color: #86868b;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 40px;
  }
  .item {
    display: block;
    padding: 20px 24px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: #fff;
    text-decoration: none;
    color: inherit;
    border: 1px solid #f0f0f0;
    transition: box-shadow .2s, border-color .2s;
  }
  .item:hover {
    border-color: #d2d2d7;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
  }
  .item-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .item:hover .item-title { color: #0071e3; }
  .item-desc {
    font-size: .88rem;
    color: #86868b;
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item-meta {
    font-size: .75rem;
    color: #aeaeb2;
  }
  .item-meta span + span::before {
    content: ' · ';
  }
  .spinner {
    text-align: center;
    padding: 64px 0;
    color: #aeaeb2;
    font-size: .88rem;
  }
  footer {
    text-align: center;
    padding: 0 24px 32px;
    font-size: .78rem;
    color: #aeaeb2;
  }
  @media (max-width: 480px) {
    main { padding: 56px 16px 64px; }
    h1 { font-size: 1.7rem; }
    .item { padding: 16px 18px; }
  }
</style>
</head>
<body>
<main>
  <h1>Works</h1>
  <p class="intro">A collection of small tools and experiments.</p>
  <div class="spinner" id="spinner">Loading…</div>
  <div id="list"></div>
</main>
<footer>&copy; 2026</footer>
<script>
function formatDate(ts) {
  return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getDesc(f) {
  return f.desc || '';
}

fetch('/files.json')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(files => {
    document.getElementById('spinner').style.display = 'none';
    const list = document.getElementById('list');
    files.forEach(f => {
      const a = document.createElement('a');
      a.className = 'item';
      a.href = '/' + f.name;
      const desc = getDesc(f);
      a.innerHTML = '<div class="item-title">' + esc(f.title) + '</div>'
        + (desc ? '<div class="item-desc">' + esc(desc) + '</div>' : '')
        + '<div class="item-meta"><span>' + esc(f.name) + '</span><span>' + formatDate(f.modified) + '</span></div>';
      list.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('list').innerHTML = '<div style="text-align:center;padding:48px 0;color:#86868b;">Failed to load.<br><a href="price.html" style="color:#0071e3;">Go to price →</a></div>';
  });
</script>
</body>
</html>
